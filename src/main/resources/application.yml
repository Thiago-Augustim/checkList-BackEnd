server:
  port: 8080

spring:
  application:
    name: checklist-backend
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
      lifecycle-management: start-only
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checklist_db}
    username: ${DB_USER:checklist_user}
    password: ${DB_PASSWORD:checklist_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  jwt:
    secret: ${JWT_SECRET:Y2hlY2tsaXN0LWZyb3RhLW9mZmxpbmUtZmlyc3Qtc2VjcmV0LWtleS0yMDI2LXNwcmluZy1ib290LTI1NmJpdHM=}
    access-token-expiration-ms: 86400000      # 24 horas
    refresh-token-expiration-ms: 2592000000   # 30 dias (suporte a viagens longas offline)
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./uploads/fotos}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
